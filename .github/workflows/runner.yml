# Runs the house on a GitHub runner: keeps Pyth prices fresh on devnet, opens and settles a
# round every 15 minutes, and runs the three Claude agents. A shift lasts about 5 h 40 min and
# ends five minutes into a round, when it starts the next shift itself. After each push, CI starts
# a shift that replaces the running one when the house code changed (or no shift is running), so
# the house restarts on the new code. Both use workflow_dispatch, the one event
# the workflow token can always start runs with. The schedule is only a watchdog: it starts a
# shift when none is running and never replaces one.
name: runner

on:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - name: Decide whether to start a shift
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          go=true
          if [ "$EVENT" = schedule ]; then
            # If the check itself fails, assume a shift is running rather than risk replacing it.
            running=$(gh run list -R "$GITHUB_REPOSITORY" --workflow runner.yml --status in_progress \
              --json databaseId --jq "[.[] | select(.databaseId != $GITHUB_RUN_ID)] | length") || running=1
            [ "${running:-1}" != 0 ] && go=false
          fi
          echo "event $EVENT, start a shift: $go"
          echo "go=$go" >> "$GITHUB_OUTPUT"

  house:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    # One house at a time: a new shift cancels the one it replaces.
    concurrency:
      group: runner
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run the house
        id: house
        env:
          PIT_SEED: ${{ secrets.PIT_SEED }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PYTH_API_KEY: ${{ secrets.PYTH_API_KEY }}
          RPC_URL: ${{ secrets.RPC_URL }}
          AGENT_MODEL: ${{ vars.AGENT_MODEL }}
          AGENT_INTERVAL_MS: ${{ vars.AGENT_INTERVAL_MS }}
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/house-shift.sh

      - name: Publish the final log
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p runner-out && touch runner-out/runner.log
          tail -n 3000 runner-out/runner.log > runner-out/recent.log
          scripts/publish-branch.sh ci-runner runner-out

      # A shift that was replaced (cancelled) must not start another one.
      - name: Start the next shift
        if: ${{ !cancelled() && steps.house.outputs.next == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run runner.yml -R "$GITHUB_REPOSITORY" --ref main
