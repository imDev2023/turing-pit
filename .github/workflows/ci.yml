# Builds and tests everything, runs the end-to-end test on a local validator, publishes the arena
# site to GitHub Pages and deploys the program to devnet (waiting, if need be, until the house
# wallet has the SOL for it). Logs and public addresses go to the ci-build branch so the build can
# be checked without access to the Actions tab.
name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      attempt:
        description: How many runs in a row have tried to deploy, waiting for the house's devnet SOL or after a failure (the deploy job starts the next one, up to 10)
        required: false
        default: "1"

permissions:
  contents: write
  actions: write

concurrency:
  group: ci
  cancel-in-progress: true

env:
  AGAVE_VERSION: v2.3.13

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      has_seed: ${{ steps.keys.outputs.has_seed }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare log folder
        run: mkdir -p ci-out && echo "{}" > ci-out/steps.json

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile 2>&1 | tail -20 | tee ci-out/install.log

      - name: House keys
        id: keys
        env:
          PIT_SEED: ${{ secrets.PIT_SEED }}
        run: |
          if [ -z "$PIT_SEED" ]; then
            echo "PIT_SEED is not set, so nothing is deployed. Add it under Settings > Secrets and variables > Actions." | tee ci-out/notice.txt
            echo "has_seed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          scripts/house-keys.sh --write "$HOME/.config/solana/id.json" "$RUNNER_TEMP/program-keypair.json" > ci-out/addresses.json
          echo "has_seed=true" >> "$GITHUB_OUTPUT"
          echo "PROGRAM_ID=$(node -p 'require("./ci-out/addresses.json").programId')" >> "$GITHUB_ENV"
          echo "AUTHORITY=$(node -p 'require("./ci-out/addresses.json").authority')" >> "$GITHUB_ENV"

      - name: Publish the house address
        if: steps.keys.outputs.has_seed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          {
            echo "commit: $GITHUB_SHA"
            echo "state: building and testing (the site and the program deploy after the tests pass)"
            echo "house: $AUTHORITY"
            echo "program: $PROGRAM_ID"
          } > ci-out/status.txt
          scripts/publish-branch.sh ci-build ci-out || true

      - name: Typecheck
        run: set -o pipefail && pnpm -r typecheck 2>&1 | tee ci-out/typecheck.log

      - name: Cache Solana toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/solana-release
            ~/.cache/solana
          key: agave-${{ env.AGAVE_VERSION }}-v1

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ hashFiles('Cargo.lock') }}-v1
          restore-keys: cargo-

      - name: Install Solana CLI
        run: |
          if [ ! -x "$HOME/solana-release/bin/solana" ]; then
            curl -sSfL -o /tmp/solana.tar.bz2 \
              "https://github.com/anza-xyz/agave/releases/download/${AGAVE_VERSION}/solana-release-x86_64-unknown-linux-gnu.tar.bz2"
            tar xjf /tmp/solana.tar.bz2 -C "$HOME"
          fi
          echo "$HOME/solana-release/bin" >> "$GITHUB_PATH"

      - name: Program unit tests
        run: set -o pipefail && cargo test --locked -p turing_pit --lib 2>&1 | tee ci-out/unit-tests.log

      - name: End-to-end test on a local validator
        run: set -o pipefail && scripts/local-e2e.sh 2>&1 | grep -v "^\s*\(Compiling\|Downloaded\|Downloading\)" | tee ci-out/e2e.log

      - name: Build the program for devnet
        if: steps.keys.outputs.has_seed == 'true'
        run: |
          set -o pipefail
          scripts/set-program-id.sh "$PROGRAM_ID"
          cargo-build-sbf --manifest-path programs/turing_pit/Cargo.toml -- --locked 2>&1 \
            | grep -v "^\s*\(Compiling\|Downloaded\|Downloading\)" | tee ci-out/build.log
          stat -c "%s bytes: %n" target/deploy/turing_pit.so | tee -a ci-out/build.log
          sha256sum target/deploy/turing_pit.so | tee -a ci-out/build.log

      - name: Keep the devnet build for the deploy job
        if: steps.keys.outputs.has_seed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: program
          path: target/deploy/turing_pit.so
          if-no-files-found: error

      - name: Build the arena site
        if: steps.keys.outputs.has_seed == 'true'
        env:
          VITE_PROGRAM_ID: ${{ env.PROGRAM_ID }}
          VITE_AUTHORITY: ${{ env.AUTHORITY }}
          VITE_RPC_URL: ${{ vars.PUBLIC_RPC_URL }}
          VITE_BASE: /${{ github.event.repository.name }}/
        run: set -o pipefail && pnpm --filter @turing-pit/web build 2>&1 | tail -15 | tee ci-out/web.log

      - name: Package the arena site
        if: steps.keys.outputs.has_seed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

      - name: Publish the build status
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        run: |
          {
            echo "commit: $GITHUB_SHA"
            echo "run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            if [ "$RESULT" = success ] && [ -n "${PROGRAM_ID:-}" ]; then
              echo "state: built and tested; publishing the site and deploying the program"
            else
              echo "build finished: $(date -u +%Y-%m-%dT%H:%M:%SZ) ($RESULT)"
            fi
            echo "program: ${PROGRAM_ID:-none}"
            echo "house: ${AUTHORITY:-none}"
          } > ci-out/status.txt
          scripts/publish-branch.sh ci-build ci-out

      - name: Keep the logs for the deploy job
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: ci-out

  pages:
    # Needs Settings > Pages > Source set to "GitHub Actions". A failure here (for example before
    # Pages is enabled) doesn't fail the run.
    needs: build
    if: needs.build.outputs.has_seed == 'true'
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  deploy:
    needs: build
    if: needs.build.outputs.has_seed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile > /dev/null

      - name: Build logs so far
        uses: actions/download-artifact@v4
        with:
          name: logs
          path: ci-out

      - name: The devnet build
        uses: actions/download-artifact@v4
        with:
          name: program
          path: target/deploy

      - name: Cache Solana toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/solana-release
            ~/.cache/solana
          key: agave-${{ env.AGAVE_VERSION }}-v1

      - name: Install Solana CLI
        run: |
          if [ ! -x "$HOME/solana-release/bin/solana" ]; then
            curl -sSfL -o /tmp/solana.tar.bz2 \
              "https://github.com/anza-xyz/agave/releases/download/${AGAVE_VERSION}/solana-release-x86_64-unknown-linux-gnu.tar.bz2"
            tar xjf /tmp/solana.tar.bz2 -C "$HOME"
          fi
          echo "$HOME/solana-release/bin" >> "$GITHUB_PATH"

      - name: House keys
        env:
          PIT_SEED: ${{ secrets.PIT_SEED }}
        run: |
          scripts/house-keys.sh --write "$HOME/.config/solana/id.json" "$RUNNER_TEMP/program-keypair.json" \
            "$RUNNER_TEMP/buffer-keypair.json" > "$RUNNER_TEMP/addresses.json"
          {
            echo "PROGRAM_ID=$(node -p "require('$RUNNER_TEMP/addresses.json').programId")"
            echo "AUTHORITY=$(node -p "require('$RUNNER_TEMP/addresses.json').authority")"
            echo "DEPLOY_BUFFER=$(node -p "require('$RUNNER_TEMP/addresses.json').deployBuffer")"
          } >> "$GITHUB_ENV"

      - name: Deploy the program to devnet
        id: deploy
        timeout-minutes: 320
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ATTEMPT: ${{ inputs.attempt || '1' }}
        run: |
          set -o pipefail
          solana config set -u devnet > /dev/null
          matches() {
            solana program dump "$PROGRAM_ID" /tmp/onchain.so > /dev/null 2>&1 && \
              python3 -c "import sys; a=open('/tmp/onchain.so','rb').read(); b=open('target/deploy/turing_pit.so','rb').read(); sys.exit(0 if a[:len(b)]==b and not a[len(b):].strip(b'\0') else 1)"
          }
          if matches; then
            echo "The program on devnet already matches this build." | tee ci-out/deploy.log
            exit 0
          fi
          # The deploy pays rent for one copy of the program: the CLI funds the buffer with it and the
          # loader moves those lamports into the program data account. On top: the program account,
          # the CLI's worst-case fee estimate (~0.04 SOL) and a little for the house to start with.
          # Checked on a local validator: rent + 0.05 SOL deploys; the real fees were 0.0014 SOL.
          size=$(stat -c %s target/deploy/turing_pit.so)
          need=$(( (size + 173) * 6960 + 100000000 ))
          balance() { local b; b=$(solana balance "$1" --lamports 2>/dev/null | cut -d' ' -f1) || true; case "$b" in ''|*[!0-9]*) echo 0;; *) echo "$b";; esac; }
          # The house's SOL, plus whatever an interrupted deploy left in the deploy buffer: the next
          # deploy carries on from that buffer instead of paying for a new one.
          funds() { echo $(( $(balance "$AUTHORITY") + $(balance "$DEPLOY_BUFFER") )); }
          started=$(date +%s); published=0; asked=0
          while true; do
            have=$(funds)
            [ "$have" -ge "$need" ] && break
            now=$(date +%s)
            if [ $(( now - asked )) -ge 120 ]; then
              # The public faucet rarely answers GitHub's runners, but it costs nothing to ask.
              solana airdrop 2 > /dev/null 2>&1 || solana airdrop 1 > /dev/null 2>&1 || true
              asked=$now
              have=$(funds)
              [ "$have" -ge "$need" ] && break
            fi
            if [ $(( now - published )) -ge 300 ]; then
              # Keep the house address and balance current on the ci-build branch: the deploy goes
              # ahead as soon as someone sends devnet SOL from https://faucet.solana.com
              {
                echo "commit: $GITHUB_SHA"
                echo "state: waiting for devnet SOL (since $(date -u -d @"$started" +%H:%M) UTC; at $(date -u -d @$(( started + 18000 )) +%H:%M) UTC this run, attempt $ATTEMPT of 10, hands over to a new one)"
                echo "house: $AUTHORITY"
                echo "program: $PROGRAM_ID"
                echo "house balance: $(( have / 1000000 )) / $(( need / 1000000 )) milli-SOL needed (checked $(date -u +%H:%M) UTC)"
              } > ci-out/status.txt
              scripts/publish-branch.sh ci-build ci-out || true
              published=$now
            fi
            if [ $(( now - started )) -gt 18000 ]; then
              # A job can't run longer than 6 hours, so a new run takes over the wait (the last step).
              echo "No devnet SOL at $AUTHORITY after 5 hours (attempt $ATTEMPT of 10)" | tee ci-out/deploy.log
              exit 1
            fi
            sleep 30
          done
          echo "house funds before deploy: $have lamports" | tee ci-out/deploy.log
          # A buffer left by a build of another size can't be carried on from: its rent goes back first.
          left=$(solana program show "$DEPLOY_BUFFER" --output json 2>/dev/null |
            python3 -c "import json, sys; print(json.load(sys.stdin)['dataLen'])" 2>/dev/null) || left=""
          if [ -n "$left" ] && [ "$left" != "$size" ]; then
            solana program close "$DEPLOY_BUFFER" 2>&1 | tee -a ci-out/deploy.log || true
          fi
          # The buffer's keypair derives from PIT_SEED, so when devnet drops writes partway, the next
          # try (or the next run) carries on from what was written, and the CLI never prints a
          # recovery phrase for a throwaway buffer into this public log.
          # The ~260 writes go straight to the leaders over QUIC. The public RPC allows each address
          # only a few requests a second and GitHub's runners share addresses: sending the writes
          # through it (--use-rpc) got this runner rate-limited (429) after ten writes and the CLI
          # stalled. A try that hangs is stopped after 15 minutes, and the next carries on.
          for try in 1 2 3 4 5 6; do
            if timeout 15m solana program deploy target/deploy/turing_pit.so \
                 --program-id "$RUNNER_TEMP/program-keypair.json" --buffer "$RUNNER_TEMP/buffer-keypair.json" \
                 --with-compute-unit-price 100000 --max-sign-attempts 10 2>&1 | tee -a ci-out/deploy.log; then
              exit 0
            fi
            sleep 60
            # The deploy may have landed even though the CLI gave up waiting for its confirmation.
            if matches; then
              echo "The program is on devnet after all." | tee -a ci-out/deploy.log
              exit 0
            fi
            echo "Deploy try $try of 6 failed." | tee -a ci-out/deploy.log
          done
          exit 1

      # A new shift replaces the running one, so the house restarts on this commit's code. This
      # doesn't rely on runner.yml listening for CI to finish: once this run was itself started by
      # the workflow token (a later attempt of the SOL wait), that event may not start anything.
      - name: Start the house
        id: start
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in 1 2 3; do
            if gh workflow run runner.yml -R "$GITHUB_REPOSITORY" --ref main; then
              echo "Started a house shift." | tee -a ci-out/deploy.log
              exit 0
            fi
            sleep 20
          done
          echo "Couldn't start a house shift." | tee -a ci-out/deploy.log
          exit 1

      - name: Publish CI status
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ci-out
          {
            echo "commit: $GITHUB_SHA"
            echo "run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "finished: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "program: ${PROGRAM_ID:-none}"
            echo "house: ${AUTHORITY:-none}"
            if [ -n "${AUTHORITY:-}" ]; then echo "house balance: $(solana balance "$AUTHORITY" -u devnet 2>&1)"; fi
            if [ -n "${PROGRAM_ID:-}" ]; then echo "program account: $(solana account "$PROGRAM_ID" -u devnet 2>&1 | head -3 | tr '\n' ' ')"; fi
          } > ci-out/status.txt
          scripts/publish-branch.sh ci-build ci-out

      # Still no SOL after 5 hours, a deploy that kept failing, or a hiccup before the house started:
      # a new run carries on (a job can't run longer than 6 hours), up to 10 runs in a row. It
      # cancels this one, so this step comes last.
      - name: Hand over to a new run
        if: failure() && (steps.deploy.outcome != 'success' || steps.start.outcome != 'success')
        env:
          GH_TOKEN: ${{ github.token }}
          ATTEMPT: ${{ inputs.attempt || '1' }}
        run: |
          if [ "$ATTEMPT" -lt 10 ]; then
            gh workflow run ci.yml -R "$GITHUB_REPOSITORY" --ref main -f attempt=$(( ATTEMPT + 1 ))
            echo "Started attempt $(( ATTEMPT + 1 )) of 10."
          else
            echo "Stopped after 10 runs in a row: push a commit or run CI by hand to try again."
          fi
