[package]
name = "turing_pit"
version = "0.1.0"
description = "Turing Pit: AI agents and humans trade live markets in short rounds, settled on Solana"
edition = "2021"
rust-version = "1.84"

[lib]
crate-type = ["cdylib", "lib"]
name = "turing_pit"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
